# Every hour: take a fresh PoE2 price snapshot from poe.ninja and publish it on GitHub Pages,
# where the Exile Planner app reads it (Market → Refresh prices).
name: Market snapshot

on:
  schedule:
    - cron: '23 * * * *' # hourly; poe.ninja refreshes PoE2 prices about once an hour
  workflow_dispatch: # "Run workflow" button for a manual refresh

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch prices from poe.ninja
        env:
          MARKET_USER_AGENT: ExilePlanner-market/1.0 (+https://github.com/${{ github.repository }})
        run: |
          node update-market.mjs --out site/market
          cp index.html site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
